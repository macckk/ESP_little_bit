; Base de firmware para CYD ESP32-2432S028 (versao 2 USB)
; Ambientes:
;   cyd2usb      -> app (LVGL + portal Wi-Fi + backend), gravacao por USB
;   cyd2usb_ota  -> mesmo app, gravacao pela rede (ArduinoOTA)
;   hwtest       -> teste de hardware (tela/toque/microSD)
; Segredos de dev (senha OTA) ficam em secrets.ini (fora do controle de versao).

[platformio]
default_envs = cyd2usb
extra_configs = secrets.ini

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = COM5
monitor_port = COM5
; 2x app de 1,75MB (OTA) + 384KB LittleFS (pets); NVS em 0x9000 como no default
board_build.partitions = partitions_cyd.csv
board_build.filesystem = littlefs
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCYD_PANEL_ST7789
build_src_filter = +<*> -<app/> -<hwtest/>

[app]
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@9.2.2
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    '-DOTA_PASSWORD="${secrets.ota_password}"'

[env:cyd2usb]
lib_deps = ${app.lib_deps}
build_flags = ${app.build_flags}
build_src_filter = ${env.build_src_filter} +<app/>

[env:cyd2usb_ota]
extends = env:cyd2usb
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags = --auth=${secrets.ota_password}

[env:hwtest]
build_src_filter = ${env.build_src_filter} +<hwtest/>
